name: Build YDLIDAR X4 Humble ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ydlidar-arm64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build YDLIDAR SDK + ROS 2 driver (ARM64)
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    env:
      ROS_DISTRO: humble
      SDK_SHA: 42a82ed10d2304094c111fc63dee8e4a229b79b7
      DRIVER_SHA: 4ef70d3f32a85704ade0be54b214f3763b1ab3e8
      SDK_PREFIX: /opt/ydlidar_sdk
      DRIVER_PREFIX: /opt/ydlidar_overlay

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ARM64 Ubuntu 22.04 runner
        run: |
          set -euo pipefail
          uname -m
          dpkg --print-architecture
          cat /etc/os-release
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          . /etc/os-release
          test "$VERSION_ID" = "22.04"

      - name: Install official ROS 2 APT repository
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            curl ca-certificates software-properties-common
          sudo add-apt-repository -y universe

          # Same ROS APT source approach as build-kobuki-arm64.yml.
          ROS_APT_VERSION="1.3.0"
          curl -fL --retry 3 \
            -o "$RUNNER_TEMP/ros2-apt-source.deb" \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_VERSION}/ros2-apt-source_${ROS_APT_VERSION}.jammy_all.deb"
          sudo dpkg -i "$RUNNER_TEMP/ros2-apt-source.deb"
          sudo apt-get update

      - name: Install Humble and build dependencies
        run: |
          set -euo pipefail
          sudo apt-get install -y \
            ros-humble-ros-base \
            ros-humble-ament-cmake \
            ros-humble-rclcpp \
            ros-humble-rmw \
            ros-humble-sensor-msgs \
            ros-humble-geometry-msgs \
            ros-humble-visualization-msgs \
            ros-humble-std-srvs \
            ros-humble-tf2-ros \
            ros-humble-launch-ros \
            python3-colcon-common-extensions \
            git build-essential cmake pkg-config file binutils

          source /opt/ros/humble/setup.bash
          test "$ROS_DISTRO" = "humble"

      - name: Fetch pinned official YDLidar-SDK
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ydlidar_build"
          cd "$GITHUB_WORKSPACE/ydlidar_build"
          git clone --branch master --single-branch \
            https://github.com/YDLIDAR/YDLidar-SDK.git
          cd YDLidar-SDK
          git checkout --detach "$SDK_SHA"
          test "$(git rev-parse HEAD)" = "$SDK_SHA"

      - name: Build and install YDLidar-SDK (static)
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/ydlidar_build/YDLidar-SDK"

          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$SDK_PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_EXAMPLES=OFF \
            -DBUILD_TEST=OFF \
            -DCMAKE_DISABLE_FIND_PACKAGE_SWIG=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_PythonLibs=ON

          cmake --build build --parallel 4
          sudo cmake --install build

          test -s "$SDK_PREFIX/lib/libydlidar_sdk.a"
          test -f "$SDK_PREFIX/lib/cmake/ydlidar_sdk/ydlidar_sdkConfig.cmake"
          file "$SDK_PREFIX/lib/libydlidar_sdk.a"

      - name: Fetch pinned official ROS 2 Humble driver
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/ydlidar_ws/src"
          cd "$GITHUB_WORKSPACE/ydlidar_ws/src"
          git clone --branch humble --single-branch \
            https://github.com/YDLIDAR/ydlidar_ros2_driver.git
          cd ydlidar_ros2_driver
          git checkout --detach "$DRIVER_SHA"
          test "$(git rev-parse HEAD)" = "$DRIVER_SHA"
          test -f params/X4.yaml

      - name: Build ROS 2 driver against installed SDK
        run: |
          set -euo pipefail
          source /opt/ros/humble/setup.bash

          # SDK CMake package is installed in a nonstandard prefix.
          export CMAKE_PREFIX_PATH="$SDK_PREFIX:${CMAKE_PREFIX_PATH:-}"
          export CMAKE_BUILD_PARALLEL_LEVEL=4

          sudo mkdir -p "$DRIVER_PREFIX"
          sudo chown "$(id -u):$(id -g)" "$DRIVER_PREFIX"

          cd "$GITHUB_WORKSPACE/ydlidar_ws"
          colcon build \
            --packages-select ydlidar_ros2_driver \
            --merge-install \
            --install-base "$DRIVER_PREFIX" \
            --cmake-args \
              -DBUILD_TESTING=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_EXE_LINKER_FLAGS=-L${SDK_PREFIX}/lib" \
              "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG -march=armv8-a"

      - name: Verify installed ROS package, X4 config and executable
        run: |
          set -euo pipefail
          source /opt/ros/humble/setup.bash
          source "$DRIVER_PREFIX/setup.bash"

          ros2 pkg prefix ydlidar_ros2_driver
          ros2 pkg executables ydlidar_ros2_driver
          ros2 pkg executables ydlidar_ros2_driver \
            | grep -q 'ydlidar_ros2_driver_node'

          BIN="$DRIVER_PREFIX/lib/ydlidar_ros2_driver/ydlidar_ros2_driver_node"
          X4="$DRIVER_PREFIX/share/ydlidar_ros2_driver/params/X4.yaml"

          test -x "$BIN"
          test -f "$X4"
          grep -Eq '^[[:space:]]+baudrate: 128000$' "$X4"
          grep -Eq '^[[:space:]]+sample_rate: 5$' "$X4"
          grep -Eq '^[[:space:]]+frame_id: laser_frame$' "$X4"

          file "$BIN"
          readelf -h "$BIN" | grep 'Machine:.*AArch64'
          ldd "$BIN"
          if ldd "$BIN" | grep -q 'not found'; then
            echo "ERROR: Unresolved shared library"
            exit 1
          fi

          # No LiDAR is attached to CI: never run the hardware node here.
          echo "PASS: ARM64 ELF, package, bundled X4.yaml, and dynamic libs"

      - name: Create Pi deployment archive and provenance files
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ydlidar_artifact"
          mkdir -p "$OUT"

          # Extract on Pi with: sudo tar -xzf ARCHIVE -C /
          sudo tar -C / -czf "$OUT/ydlidar_humble_arm64.tar.gz" \
            opt/ydlidar_sdk \
            opt/ydlidar_overlay
          sudo chown "$(id -u):$(id -g)" \
            "$OUT/ydlidar_humble_arm64.tar.gz"

          cp \
            "$DRIVER_PREFIX/share/ydlidar_ros2_driver/params/X4.yaml" \
            "$OUT/X4_OFFICIAL.yaml"

          {
            echo "OS=Ubuntu 22.04"
            echo "ARCH=arm64"
            echo "ROS_DISTRO=humble"
            echo "SDK_REPO=https://github.com/YDLIDAR/YDLidar-SDK"
            echo "SDK_SHA=$SDK_SHA"
            echo "DRIVER_REPO=https://github.com/YDLIDAR/ydlidar_ros2_driver"
            echo "DRIVER_SHA=$DRIVER_SHA"
            echo "SDK_PREFIX=$SDK_PREFIX"
            echo "DRIVER_PREFIX=$DRIVER_PREFIX"
            echo "RUN_ID=$GITHUB_RUN_ID"
            echo "RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          } > "$OUT/SOURCE_COMMITS.txt"

          dpkg-query -W 'ros-humble-*' > "$OUT/ROS_PACKAGES.txt"
          (
            cd "$OUT"
            sha256sum ydlidar_humble_arm64.tar.gz \
              > ydlidar_humble_arm64.sha256
            sha256sum -c ydlidar_humble_arm64.sha256
            tar -tzf ydlidar_humble_arm64.tar.gz \
              | grep 'opt/ydlidar_overlay/' > /dev/null
          )

      - name: Upload ARM64 deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ydlidar-humble-arm64
          path: |
            ${{ runner.temp }}/ydlidar_artifact/ydlidar_humble_arm64.tar.gz
            ${{ runner.temp }}/ydlidar_artifact/ydlidar_humble_arm64.sha256
            ${{ runner.temp }}/ydlidar_artifact/SOURCE_COMMITS.txt
            ${{ runner.temp }}/ydlidar_artifact/ROS_PACKAGES.txt
            ${{ runner.temp }}/ydlidar_artifact/X4_OFFICIAL.yaml
          if-no-files-found: error
          retention-days: 30
