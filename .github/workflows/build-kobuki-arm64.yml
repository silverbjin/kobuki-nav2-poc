
name: Build Kobuki Humble ARM64

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build kobuki_node for ARM64
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90

    defaults:
      run:
        shell: bash

    steps:
      # 1. Repository checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Verify build architecture
      - name: Check ARM64 environment
        run: |
          set -euo pipefail
          uname -m
          dpkg --print-architecture
          cat /etc/os-release

          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"
          . /etc/os-release
          test "$VERSION_ID" = "22.04"

      # 3. Register official ROS repository
      - name: Install ROS APT repository
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl ca-certificates \
            software-properties-common

          sudo add-apt-repository -y universe

          ROS_APT_VERSION="1.3.0"

          curl -fL --retry 3 \
            -o /tmp/ros2-apt-source.deb \
            "https://github.com/ros-infrastructure/ros-apt-source/releases/download/${ROS_APT_VERSION}/ros2-apt-source_${ROS_APT_VERSION}.jammy_all.deb"

          sudo dpkg -i /tmp/ros2-apt-source.deb
          sudo apt-get update

      # 4. Install ROS and build dependencies
      - name: Install ROS Humble dependencies
        run: |
          set -euo pipefail

          sudo apt-get install -y \
            ros-humble-ros-base \
            ros-humble-kobuki-core \
            ros-humble-kobuki-ros-interfaces \
            python3-rosdep \
            python3-colcon-common-extensions \
            git build-essential cmake file

          if [ ! -f /etc/ros/rosdep/sources.list.d/20-default.list ]; then
            sudo rosdep init
          fi

          rosdep update

          source /opt/ros/humble/setup.bash
          test "$ROS_DISTRO" = "humble"

      # 5. Fetch official Kobuki source
      - name: Get Kobuki official source
        run: |
          set -euo pipefail

          mkdir -p ws/src
          cd ws/src

          git clone \
            --single-branch \
            --branch release/1.2.x \
            https://github.com/kobuki-base/kobuki_ros.git

          cd kobuki_ros

          git checkout \
            971a005e4921b139f798934aca3b21bb0270cf46

          test "$(git rev-parse HEAD)" = \
            "971a005e4921b139f798934aca3b21bb0270cf46"

          git rev-parse HEAD

      # 6. Resolve only kobuki_node dependencies
      - name: Install kobuki_node dependencies
        run: |
          set -euo pipefail

          source /opt/ros/humble/setup.bash
          cd ws

          rosdep install \
            --from-paths src/kobuki_ros/kobuki_node \
            --ignore-src \
            --rosdistro humble \
            -r -y

      # 7. Native ARM64 build
      - name: Build kobuki_node
        run: |
          set -euo pipefail

          source /opt/ros/humble/setup.bash

          sudo mkdir -p /opt/kobuki_overlay
          sudo chown "$(id -u):$(id -g)" \
            /opt/kobuki_overlay

          cd ws
          export CMAKE_BUILD_PARALLEL_LEVEL=4

          colcon build \
            --packages-select kobuki_node \
            --merge-install \
            --install-base /opt/kobuki_overlay \
            --cmake-args \
              -DBUILD_TESTING=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              "-DCMAKE_CXX_FLAGS_RELEASE=-O2 -DNDEBUG -march=armv8-a"

      # 8. Verify built binary
      - name: Verify ARM64 package
        run: |
          set -euo pipefail

          source /opt/ros/humble/setup.bash
          source /opt/kobuki_overlay/setup.bash

          ros2 pkg prefix kobuki_node
          ros2 pkg executables kobuki_node

          ros2 pkg executables kobuki_node \
            | grep -q kobuki_ros_node

          BIN=/opt/kobuki_overlay/lib/kobuki_node/kobuki_ros_node

          test -x "$BIN"
          file "$BIN"
          readelf -h "$BIN" | grep AArch64

          ldd "$BIN"

          if ldd "$BIN" | grep -q "not found"; then
            echo "Missing shared libraries"
            exit 1
          fi

      # 9. Package fixed install directory
      - name: Create deployment archive
        run: |
          set -euo pipefail

          tar -C /opt -czf \
            "$RUNNER_TEMP/kobuki_overlay_arm64.tar.gz" \
            kobuki_overlay

          cd "$RUNNER_TEMP"

          sha256sum kobuki_overlay_arm64.tar.gz \
            > kobuki_overlay_arm64.sha256

          echo \
            "971a005e4921b139f798934aca3b21bb0270cf46" \
            > KOBUKI_SOURCE_SHA.txt

          dpkg-query -W 'ros-humble-*' \
            > ROS_PACKAGES.txt

      # 10. Upload downloadable artifact
      - name: Upload ARM64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobuki-humble-arm64
          path: |
            ${{ runner.temp }}/kobuki_overlay_arm64.tar.gz
            ${{ runner.temp }}/kobuki_overlay_arm64.sha256
            ${{ runner.temp }}/KOBUKI_SOURCE_SHA.txt
            ${{ runner.temp }}/ROS_PACKAGES.txt
          if-no-files-found: error
          retention-days: 30

